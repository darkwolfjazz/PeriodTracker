<div
  class="min-h-screen bg-gradient-to-br from-pink-50 to-purple-100 dark:from-zinc-900 dark:to-purple-950 p-6 flex justify-center items-center"
>
  <!-- blobs -->

  <div
    class="aura-blob-1 absolute w-72 h-72 bg-pink-400 rounded-full blur-3xl opacity-20 top-10 left-10"
  ></div>

  <div
    class="aura-blob-2 absolute w-72 h-72 bg-purple-400 rounded-full blur-3xl opacity-20 bottom-10 right-10"
  ></div>

  <div
    class="aura-card relative z-10 w-full max-w-3xl h-[85vh] bg-white/70 dark:bg-zinc-800/70 backdrop-blur-xl rounded-3xl shadow-2xl flex flex-col p-6"
  >
    <!-- header -->

    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold text-pink-200">🌸 Aura</h1>

      <button (click)="logout()" class="px-4 py-2 rounded-xl bg-white/20 text-white">Logout</button>
    </div>

    <!-- chat -->

    <div class="flex-1 overflow-y-auto space-y-4 mb-4">
      @for (message of messages; track message) {
        <div class="flex" [class.justify-end]="message.sender === 'user'">
          <div
            class="max-w-[70%] px-5 py-3 rounded-3xl"
            [class.bg-pink-500]="message.sender === 'user'"
            [class.text-white]="message.sender === 'user'"
            [class.bg-white]="message.sender === 'aura'"
          >
            {{ message.text }}
          </div>
        </div>
      }

      @if (isLoading) {
        <p class="text-pink-400">Aura is typing...</p>
      }
    </div>

    <!-- input -->

    <div class="flex gap-3">
      <input
        [(ngModel)]="userMessage"
        (keyup.enter)="sendMessage()"
        placeholder="Ask Aura anything..."
        class="flex-1 rounded-2xl px-4 py-4 border border-pink-200 outline-none text-pink-300"
      />

      <button (click)="sendMessage()" class="px-6 rounded-2xl bg-pink-500 text-white cursor-pointer">
        Send ✨
      </button>
    </div>
  </div>
</div>
